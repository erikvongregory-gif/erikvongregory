<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 569" fill="currentColor" role="img" aria-label="BrewAI">
  <title>BrewAI</title>
  <defs>
    <clipPath id="beaker">
      <rect x="188" y="70" width="116" height="280" rx="36"/>
    </clipPath>
    <clipPath id="mug-glass">
      <path d="M216 108 H394 V316 C394 338 358 350 305 350 C252 350 216 338 216 316 Z"/>
    </clipPath>
  </defs>
  <style>
    .word { transform-origin: 328px 520px; animation: word-in 0.8s 0.28s cubic-bezier(.2,.7,.2,1) both; }
    .state-b { transform-origin: 328px 192px; animation: b-cycle 7s 0.9s both infinite; }
    .state-mug { transform-origin: 328px 200px; animation: mug-cycle 7s 0.9s both infinite; }
    .handle { transform-origin: 410px 200px; animation: handle-pop 7s 0.9s both infinite; }
    .foam { transform-origin: 305px 78px; animation: foam-pop 7s 0.9s both infinite; }
    .bubble { fill: currentColor; animation: rise 2.6s cubic-bezier(.4,0,.2,1) infinite; }
    .b2 { animation-delay: 0.85s; }
    .b3 { animation-delay: 1.6s; }
    .mug-bubble { animation-duration: 2.1s; }

    @keyframes word-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes rise {
      0% { opacity: 0; transform: translateY(0) scale(0.55); }
      18% { opacity: 1; }
      72% { opacity: 0.85; }
      100% { opacity: 0; transform: translateY(-220px) scale(1); }
    }
    @keyframes b-cycle {
      0%, 30% { opacity: 1; transform: none; }
      33% { opacity: 0; transform: scale(0.86) rotate(4deg); }
      33.01%, 74% { opacity: 0; visibility: hidden; }
      77% { opacity: 1; transform: scale(1.05); }
      82%, 100% { opacity: 1; transform: none; }
    }
    @keyframes mug-cycle {
      0%, 30% { opacity: 0; transform: scale(0.78) rotate(-8deg); visibility: hidden; }
      33% { opacity: 1; transform: scale(1.08); visibility: visible; }
      37%, 70% { opacity: 1; transform: none; visibility: visible; }
      74% { opacity: 0; transform: scale(0.82) rotate(6deg); }
      74.01%, 100% { opacity: 0; visibility: hidden; }
    }
    @keyframes handle-pop {
      0%, 30% { transform: scale(0.15, 0.55); opacity: 0; }
      34% { transform: scale(1.12); opacity: 1; }
      38%, 70% { transform: none; opacity: 1; }
      74%, 100% { transform: scale(0.15, 0.55); opacity: 0; }
    }
    @keyframes foam-pop {
      0%, 31% { transform: scale(0.4, 0); opacity: 0; }
      35% { transform: scale(1.08, 1.16); opacity: 1; }
      40%, 70% { transform: none; opacity: 1; }
      74%, 100% { transform: scale(0.5, 0); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .word, .state-b, .state-mug, .handle, .foam, .bubble { animation: none; }
      .state-mug, .handle, .foam { display: none; }
    }
  </style>

